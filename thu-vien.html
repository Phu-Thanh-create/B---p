<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh - Lớp 11A2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-container {
            max-width: 1200px;
            margin: 100px auto 50px auto;
            padding: 0 20px;
            text-align: center;
        }
        .gallery-title {
            font-size: 36px;
            color: #0056b3;
            margin-bottom: 10px;
            font-weight: 900;
        }
        .gallery-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }
        /* Lưới ảnh: tự động chia 3 cột trên máy tính, 1 cột trên điện thoại */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .gallery-grid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .gallery-grid img:hover {
            transform: scale(1.03);
        }
        /* Nút quay lại */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #0056b3;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .back-btn:hover { background-color: #003d82; }
    </style>
</head>
<body>
    <!-- Nút quay lại trang chính -->
    <a href="trang-chinh.html" class="back-btn">← Quay lại trang chính</a>

    <div class="gallery-container">

        <p class="gallery-subtitle">Toàn cảnh trường qua các thời kỳ</p>

        <!-- Lưới chứa 30 tấm ảnh -->
