<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chính - Lớp 11A2</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện 3D -->
   <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <!-- Thanh Menu (Cố định) -->
    <header class="navbar">
        <div class="logo">Lớp 11A2</div>
        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="#anh-3d">Ảnh 3D</a>
            <a href="#gioi-thieu">Giới thiệu</a>
            <a href="#lien-he">Liên hệ</a>
        </nav>
    </header>
    <!-- Phần Xin Chào (Có ảnh nền) -->
    <section id="trang-chu" class="hero-section">
        <div class="hero-bg"></div> <!-- Lớp ảnh nền -->
        <h1>Xin gửi lời chào tới vị khách đã ghé thăm!</h1>
    </section>

        <!-- Phần Nội dung (Ảnh 360) -->
    <section id="anh-3d" class="main-content">
        
        <div class="section-title">
            <span class="text-3d">360°</span> <span class="text-sub">Toàn cảnh không gian 11A2!</span>
        </div>

               <!-- Khung chứa ảnh 360 (đã bỏ nền đen) -->
        <model-viewer src="https://modelviewer.dev/shared-assets/environments/moon_1k.hdr" 
                      alt="Ảnh toàn cảnh 360 độ" 
                      camera-controls 
                      auto-rotate
                      style="width: 100%; height: 600px; border-radius: 20px; background-color: transparent;">
        </model-viewer>
            
        </div>

    </section>

    <!-- Các phần để test cuộn (bạn có thể thêm nội dung sau) -->
    <section id="gioi-thieu" style="height: 800px; padding: 50px; text-align: center;">
        <h2 style="margin-top: 50px; color: #0056b3;">Giới thiệu</h2>
    </section>
    <section id="lien-he" style="height: 800px; padding: 50px; text-align: center;">
        <h2 style="margin-top: 50px; color: #0056b3;">Liên hệ</h2>
    </section>

    <script src="script.js"></script>
</body>
</html>
