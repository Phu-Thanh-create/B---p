<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chính - Lớp 11A2</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Thư viện Pannellum -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

    <header class="navbar">
        <div class="logo">Lớp 11A2</div>
        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="#anh-3d">Ảnh 3D</a>
            <a href="#gioi-thieu">Giới thiệu</a>
            <a href="#lien-he">Liên hệ</a>
        </nav>
    </header>
    
    <section id="trang-chu" class="hero-section">
        <div class="hero-bg"></div>
        <h1>Xin gửi lời chào tới vị khách đã ghé thăm!</h1>
    </section>

    <section id="anh-3d" class="main-content">
        
        <div class="section-title">
            <span class="text-3d">360°</span> <span class="text-sub">Một vài tấm ảnh đặc biệt từ chúng tôi!</span>
        </div>

        <!-- Khung chứa ảnh 360 -->
        <div style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative;">
            <!-- CHỈ CÓ DUY NHẤT 1 THẺ PANORAMA NÀY THÔI -->
            <div id="panorama" style="width: 100%; height: 600px;"></div>
            
            <!-- Thanh công cụ nổi -->
            <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 8px; border-radius: 16px; gap: 8px;">
                <button onclick="toggleAutoRotate()" style="cursor: pointer; border: none; background: #4f46e5; color: white; border-radius: 8px; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;">
                    <i id="icon-rotate" class="fa-solid fa-pause"></i>
                </button>
                <div style="width: 1px; height: 24px; background: #334155; margin: 0 4px;"></div>
                <button onclick="zoomIn()" style="cursor: pointer; border: none; background: transparent; color: #cbd5e1; width: 44px; height: 44px;"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button onclick="zoomOut()" style="cursor: pointer; border: none; background: transparent; color: #cbd5e1; width: 44px; height: 44px;"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <button onclick="resetView()" style="cursor: pointer; border: none; background: transparent; color: #cbd5e1; width: 44px; height: 44px;"><i class="fa-solid fa-arrows-to-dot"></i></button>
            </div>
        </div>

        <script>
            let viewer;
            let isAutoRotating = true;
            
            // ĐẢM BẢO FILE NÀY ĐÃ CÓ TRÊN GITHUB
            const defaultPanorama = "cong-truong.jpg"; 

            window.addEventListener('load', function() {
                viewer = pannellum.viewer('panorama', {
                    "type": "equirectangular",
                    "panorama": defaultPanorama,
                    "autoLoad": true,
                    "autoRotate": -2,
                    "autoRotateInactivityDelay": 3000,
                    "showControls": false,
                    "hfov": 100
                });

                viewer.on('load', function() {
                    isAutoRotating = true;
                    updateRotateIcon();
                });
            });

            function toggleAutoRotate() {
                if (!viewer) return;
                if (isAutoRotating) {
                    viewer.stopAutoRotate();
                    isAutoRotating = false;
                } else {
                    viewer.startAutoRotate(-2);
                    isAutoRotating = true;
                }
                updateRotateIcon();
            }

            function updateRotateIcon() {
                const icon = document.getElementById('icon-rotate');
                if (isAutoRotating) {
                    icon.className = "fa-solid fa-pause";
                } else {
                    icon.className = "fa-solid fa-play";
                }
            }

            function zoomIn() { if (viewer) viewer.setHfov(viewer.getHfov() - 15); }
            function zoomOut() { if (viewer) viewer.setHfov(viewer.getHfov() + 15); }
            function resetView() { if (viewer) { viewer.setPitch(0); viewer.setYaw(0); viewer.setHfov(100); } }
        </script>

    </section>

    <section id="gioi-thieu" style="height: 800px; padding: 50px; text-align: center;">
        <h2 style="margin-top: 50px; color: #0056b3;">Giới thiệu</h2>
    </section>
    <section id="lien-he" style="height: 800px; padding: 50px; text-align: center;">
        <h2 style="margin-top: 50px; color: #0056b3;">Liên hệ</h2>
    </section>

    <script src="script.js"></script>
</body>
</html>
